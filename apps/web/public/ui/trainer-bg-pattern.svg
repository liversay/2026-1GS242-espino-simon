<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <title>Trainer card diagonal stripes (tileable)</title>
  <defs>
    <pattern id="stripes" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="16" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
      <line x1="8" y1="0" x2="8" y2="16" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="16" height="16" fill="url(#stripes)"/>
</svg>
